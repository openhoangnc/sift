[package]
name = "sift-dns"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
sift-core = { path = "../sift-core" }
sift-filter = { path = "../sift-filter" }
ahash = "0.8.12"
base64 = "0.23.1"
bytes = "1.12.1"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hickory-proto = "0.26.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "tokio"] }
jiff = { version = "0.2.37", features = ["serde"] }
parking_lot = "0.12.5"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.10.2"
ring = "0.17.14"
rustls = { version = "0.23.44", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "signal"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
url = "2.5.8"
webpki-roots = "1.0.9"
x509-parser = "0.18.1"

[dev-dependencies]
# The `server` feature is only ever wanted by the tests, which run a local
# DNS-over-HTTPS server to count what a client actually opens.
hyper = { version = "1.11.1", features = ["server"] }
rcgen = "0.14.10"
rustls-pemfile = "2.2.0"
# `test-util` lets the tests of the stream deadlines run on a paused clock,
# so a five-second timeout is proved in no time rather than slept through.
tokio = { version = "1.53.1", features = ["test-util"] }
