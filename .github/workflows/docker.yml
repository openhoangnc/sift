name: Docker

# The only workflow, and it runs on request only: a push to main whose commit
# message carries `[deploy]`, or a manual run. Pushing a tag does not start a
# build.
#
# Every run builds the image for amd64 and arm64 on native runners, publishes
# one multi-architecture tag to GHCR, and then prunes the package back to the
# newest three releases.
#
# Run on a release tag, it also builds the installer's archives and attaches
# them to the GitHub release for that tag:
#
#     git tag -a v1.2.3 -m "…" && git push origin v1.2.3
#     gh workflow run docker.yml --ref v1.2.3
#
# The archives are what `scripts/install.sh` and the self-updater fetch, so
# their names and the layout inside them are a contract: `sift_<os>_<cpu>.tar.gz`,
# holding `AdGuardHome/AdGuardHome` — AdGuard Home's own package layout, which
# is what lets an existing installation be upgraded in place.
# `scripts/package.sh` builds them, here and by hand alike. Every Linux build
# is statically linked against musl, so one archive per architecture runs on
# any distribution, however old its glibc.
#
# There is no CI workflow: the test, lint and differential suite runs locally —
# `cargo test --workspace`, `scripts/build-frontend.sh` and `scripts/verify.sh`.

on:
  push:
    branches: [main]
    # A documentation-only commit does not change the image, and the build is
    # two full LTO compiles of the workspace.
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # How many published releases to keep in the registry.
  KEEP_RELEASES: '3'

# A newer push makes an in-flight build pointless; stop paying for it. A
# release is never cancelled halfway through attaching its archives.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # Opt-in: a push runs only when one of its commit messages carries `[deploy]`.
    # A skipped job allocates no runner and bills nothing. Manual runs always go.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(join(github.event.commits.*.message), '[deploy]')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            # Native arm64, so the Rust build is not emulated. Free on public
            # repositories.
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Describe this build
        id: vars
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${GITHUB_REF_NAME}-${GITHUB_SHA:0:7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "slug=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_OUTPUT"

      # Pushed by digest with no tag: the merge job below is what names the
      # image, so a half-finished multi-architecture push never claims `latest`.
      #
      # `provenance: false` keeps each build a single manifest. Attestations
      # would add manifests that nothing references, which the prune below
      # would then have to tell apart from stale ones.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ steps.vars.outputs.date }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ steps.vars.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.vars.outputs.slug }}

      - name: Export the digest
        run: |
          set -eu
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.vars.outputs.slug }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          # The file is empty and only has to survive until the merge job.
          retention-days: 1

  merge:
    name: Publish the manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create the multi-architecture manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          set -eu
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect what was published
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.meta.outputs.version }}"

  prune:
    name: Prune old images
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A published release is one tagged index plus one untagged manifest per
      # architecture. Deleting an index's children breaks `docker pull` for
      # that architecture, so the children of everything kept are resolved and
      # kept too, rather than counting versions blindly.
      - name: Work out what is stale
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          KEEP: ${{ env.KEEP_RELEASES }}
        run: |
          set -euo pipefail

          # The first run of this workflow prunes nothing, and a missing
          # package is the only listing failure that is not a problem.
          if ! gh api "/users/$OWNER/packages/container/$PACKAGE" >/dev/null 2>&1; then
            echo "No package published yet; nothing to prune."
            echo "ids=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An untagged manifest younger than this is very likely a build in
          # flight, not a leftover.  Pushing a commit and its release tag
          # starts two runs, and the first to finish used to delete the
          # per-architecture manifests the second had already pushed but not
          # yet assembled -- which failed that run with "not found" against a
          # digest it had just created.  They cost nothing to leave; the next
          # run collects them.
          cutoff="$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)"
          echo "keeping untagged manifests newer than $cutoff"

          # Newest first. Sorted here rather than trusted from the API, which
          # documents no order, and `--paginate` would only order within a page
          # anyway. ISO 8601 sorts lexically.
          all="$(gh api --paginate \
            "/users/$OWNER/packages/container/$PACKAGE/versions" \
            --jq '.[] | [.created_at, .id, .name, ((.metadata.container.tags // []) | join(" "))] | @tsv' \
            | sort -r)"

          keep=""
          kept=0
          while IFS=$'\t' read -r created id digest tags; do
            [ -n "${tags:-}" ] || continue
            kept=$((kept + 1))
            [ "$kept" -le "$KEEP" ] || continue
            echo "keep    $digest  $created  [$tags]"
            keep="$keep $digest"
            # Its per-architecture manifests have to survive with it.
            for child in $(docker buildx imagetools inspect --raw "$IMAGE@$digest" \
                             | jq -r '.manifests[]?.digest'); do
              echo "keep    $child  (child of $tags)"
              keep="$keep $child"
            done
          done <<< "$all"

          keep=" $keep "
          ids=""
          while IFS=$'\t' read -r created id digest tags; do
            case "$keep" in *" $digest "*) continue ;; esac
            if [ -z "${tags:-}" ] && [[ "$created" > "$cutoff" ]]; then
              echo "skip    $digest  $created  (untagged, but a build may still be assembling it)"
              continue
            fi
            echo "delete  $digest  $created  [${tags:-untagged}]"
            ids="$ids,$id"
          done <<< "$all"

          echo "ids=${ids#,}" >> "$GITHUB_OUTPUT"

      - name: Delete them
        if: steps.plan.outputs.ids != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          package-version-ids: ${{ steps.plan.outputs.ids }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # ---- Release archives: only when run on a `v*` tag -------------------------
  #
  # A tag is the one moment the suite is worth paying for on a clean machine:
  # there is no CI workflow, and a release nobody can un-publish should not be
  # the first place a red test is noticed. A push is always to a branch, so
  # none of these can start without a manual run.
  test:
    name: Tests
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --locked

  archives:
    name: ${{ matrix.os }}_${{ matrix.cpu }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      # A leg that fails should not take the others down with it: the failure
      # is easier to read next to four archives that did build.
      fail-fast: false
      matrix:
        include:
          - os: linux
            cpu: amd64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - os: linux
            cpu: arm64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # The only leg that is not built on its own architecture.  There is
          # no 32-bit Arm runner, and no musl cross toolchain in apt, so this
          # one goes through cross's container images.
          - os: linux
            cpu: armv7
            target: armv7-unknown-linux-musleabihf
            runner: ubuntu-latest
            cross: true
          - os: darwin
            cpu: amd64
            target: x86_64-apple-darwin
            runner: macos-latest
          - os: darwin
            cpu: arm64
            target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: |
          # Naming no toolchain installs the one rust-toolchain.toml pins,
          # rather than whatever the runner happens to ship.
          rustup show
          rustup target add '${{ matrix.target }}'

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # ring, the rustls crypto provider, needs a C compiler for the target.
      # cc-rs looks for musl-gcc on a musl target, which is what this package
      # provides for the architecture it is installed on.
      - name: musl toolchain
        if: matrix.os == 'linux' && !matrix.cross
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Build
        run: |
          set -eu
          if [ '${{ matrix.cross }}' = 'true' ]; then
            cross build --locked --profile dist --bin AdGuardHome --target '${{ matrix.target }}'
          else
            cargo build --locked --profile dist --bin AdGuardHome --target '${{ matrix.target }}'
          fi

      - name: Package
        run: |
          scripts/package.sh \
            'target/${{ matrix.target }}/dist/AdGuardHome' \
            '${{ matrix.os }}' \
            '${{ matrix.cpu }}' \
            dist

      # A binary for the machine this runs on is worth starting once: a
      # missing symbol or a bad crypto provider fails here rather than on
      # somebody's DNS server.
      - name: It runs
        if: |
          (matrix.cpu == 'amd64' && matrix.os == 'linux' && runner.arch == 'X64')
          || (matrix.cpu == 'arm64' && matrix.os == 'linux' && runner.arch == 'ARM64')
          || (matrix.cpu == 'arm64' && matrix.os == 'darwin')
        run: |
          set -eu
          'target/${{ matrix.target }}/dist/AdGuardHome' --version
          'target/${{ matrix.target }}/dist/AdGuardHome' --version | grep -q '^Sift, version v'

      - uses: actions/upload-artifact@v4
        with:
          name: sift_${{ matrix.os }}_${{ matrix.cpu }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Attach to the release
    needs: archives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: sift_*
          merge-multiple: true

      - name: Checksums and version
        id: meta
        run: |
          set -eu
          tag='${{ github.ref_name }}'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          cd dist
          ls -l
          sha256sum sift_*.tar.gz > checksums.txt
          cat checksums.txt

          # The installer reads this to learn what the newest release is: one
          # unauthenticated GET of a fixed URL, rather than the API, which
          # rate-limits by address and would refuse a whole household behind
          # one of them.
          printf '%s\n' "$tag" > version.txt

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -eu
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "Sift $TAG"
          fi

          gh release upload "$TAG" --clobber \
            dist/sift_*.tar.gz dist/checksums.txt dist/version.txt

          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.name)\t\(.size)"'
